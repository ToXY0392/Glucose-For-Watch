name: Architecture diagram export

on:
  pull_request:
    paths:
      - "docs/dev/architecture.md"
      - "docs/assets/glucose-for-watch-architecture.svg"
      - "scripts/assets/export-architecture-diagram.sh"
      - ".github/workflows/architecture-diagram.yml"
  push:
    branches:
      - develop/integration
    paths:
      - "docs/dev/architecture.md"
      - "docs/assets/glucose-for-watch-architecture.svg"
      - ".github/workflows/architecture-diagram.yml"

jobs:
  verify-diagram:
    name: Verify architecture PNG matches SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node for resvg CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate PNG
        run: |
          chmod +x ./scripts/assets/export-architecture-diagram.sh
          bash ./scripts/assets/export-architecture-diagram.sh

      - name: Upload rendered PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagram-render
          path: docs/assets/glucose-for-watch-architecture.png
          if-no-files-found: ignore

      - name: Check PNG drift
        run: |
          git diff --exit-code docs/assets/glucose-for-watch-architecture.png
