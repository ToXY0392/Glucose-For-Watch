# Single place for every dependency and plugin version. Dependabot reads this file.
[versions]
agp = "9.5.3"
kotlin = "2.4.21"
ksp = "2.3.14"
ktlint-gradle = "14.2.0"
coroutines = "1.11.0"
activity = "1.13.0"
lifecycle = "2.11.1"
compose-bom = "2026.11.01"
showkase = "1.0.5"
wear-compose = "1.7.2"
wear-tiles = "1.6.2"
watchface-complications = "1.3.0"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.11.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version = "1.1.0" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version = "2.12.0" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

androidx-wear = { module = "androidx.wear:wear", version = "1.4.0" }
